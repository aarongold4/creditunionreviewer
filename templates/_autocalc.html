<div class="calc" id="auto-calc" data-default-apr="{{ calc_default_apr }}">
  <div class="calc-grid">
    <label>Loan amount
      <div class="calc-input"><span class="calc-pre">$</span><input type="number" id="calc-amount" value="30000" min="500" step="500"></div>
    </label>
    <label>Term (months)
      <select id="calc-term">
        <option value="36">36</option>
        <option value="48">48</option>
        <option value="60" selected>60</option>
        <option value="72">72</option>
        <option value="84">84</option>
      </select>
    </label>
    <label>APR (%)
      <div class="calc-input"><input type="number" id="calc-apr" value="{{ calc_default_apr }}" min="0" max="30" step="0.01"><span class="calc-post">%</span></div>
    </label>
  </div>
  <div class="calc-out">
    <div class="calc-result"><span class="calc-label">Monthly payment</span><span class="calc-big" id="calc-monthly">$0</span></div>
    <div class="calc-result"><span class="calc-label">Total interest</span><span class="calc-val" id="calc-interest">$0</span></div>
    <div class="calc-result"><span class="calc-label">Total paid</span><span class="calc-val" id="calc-total">$0</span></div>
  </div>
  <p class="calc-note">Estimate only. Your actual rate depends on credit, term, and lender. APR pre-filled with the lowest representative new-auto rate among the credit unions we review (as of {{ rates_as_of }}).</p>
</div>
<script>
(function () {
  var box = document.getElementById('auto-calc');
  if (!box) return;
  var amt = document.getElementById('calc-amount');
  var term = document.getElementById('calc-term');
  var apr = document.getElementById('calc-apr');
  var fmt = function (n) { return '$' + (Math.round(n)).toLocaleString('en-US'); };
  function calc() {
    var P = parseFloat(amt.value) || 0;
    var n = parseInt(term.value, 10) || 1;
    var r = (parseFloat(apr.value) || 0) / 100 / 12;
    var m = r === 0 ? P / n : P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
    var total = m * n;
    document.getElementById('calc-monthly').textContent = fmt(m);
    document.getElementById('calc-interest').textContent = fmt(total - P);
    document.getElementById('calc-total').textContent = fmt(total);
  }
  [amt, term, apr].forEach(function (el) { el.addEventListener('input', calc); el.addEventListener('change', calc); });
  calc();
})();
</script>
